name: Deploy to GitHub Pages

# Every push to main rebuilds and republishes. Nothing is deployed by hand,
# so what is live always corresponds to a commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead of cancelling, so a push is never
# silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm

      - run: npm ci

      # BASE_PATH is a repository variable, not a hardcoded value: it holds
      # /radovar-site while the site is served from the project URL, and is
      # cleared when the custom domain takes over. No code change either way.
      - name: Build static export
        run: npx next build
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
